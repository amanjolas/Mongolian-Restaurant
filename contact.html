<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">Nomad Taste</div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="culture.html">Culture</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <section class="contact">

        <h1>Contact & Reservation</h1>

        <div class="contact-container">

            <!-- FORM -->
            <form id="contactForm">

                <input type="text" placeholder="Your Name" required>

                <input type="email" placeholder="Your Email" required>

                <input type="date" required>

                <input type="number" placeholder="Number of Guests" required>

                <textarea placeholder="Message"></textarea>

                <button type="submit">Book Table</button>

            </form>

            <!-- ADDRESS -->
            <div class="address">

                <h2>Location</h2>

                <p>
                    Mongolian Restaurant<br>
                    42, Green Lanes<br>
                    Haringey Borough<br>
                    London, United Kingdom<br>
                    N16/9DA
                </p>

                <p>
                    Open: 11:00 - 23:00
                </p>

            </div>

        </div>

    </section>

    <footer>
        <p>© 2026 Nomad Taste</p>
    </footer>

    <script src="javascript/script.js"></script>

</body>
</html>
